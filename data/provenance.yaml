# Where this data comes from and what was done to it.

source:
  name: United Nations Statistical Yearbook, tables in CSV ("Popular statistical tables")
  publisher: United Nations Statistics Division (UNSD), Department of Economic and Social Affairs
  page: https://data.un.org/Default.aspx
  terms_of_use: https://data.un.org/Host.aspx?Content=UNdataUse
  licence:
    applied: UNdata Terms of Use (read 2026-10-06)
    text: >-
      All data and metadata provided on UNdata’s website are available free of
      charge and may be copied freely, duplicated and further distributed
      provided that UNdata is cited as the reference.
    card: "license: other, license_name: undata-terms-of-use"
    attribution_required: true
    commercial_use: not mentioned in the terms
    modification: not mentioned in the terms
    originating_agencies: |
      Every row has a Source column naming the agency the value comes from.
      UNdata's terms do not mention those agencies' rights; their own terms
      may differ. Found stricter (2026-10-06): ITU (non-commercial without
      permission; table 314), WHO (public health purposes; tables 154, 325,
      315, part of 246), UN Comtrade (no re-dissemination without UNSD's
      permission; tables 123, 330), IMF (commercial use needs permission;
      tables 125, 130). Not checked: IUCN, UNWTO, WIPO, IPU, UNODC.
  encoding: windows-1252 (stated nowhere; every file decodes strictly as Windows-1252, not as UTF-8)
  published_row_counts: none stated
  not_included:
    - the PDF version of each table (same tables laid out for print)
    - editions the page does not link (e.g. SYB67); their names could only be guessed and the server refuses directory listings
    - the printed Statistical Yearbook (PDF) on unstats.un.org

